name: Couleur Tempo du jour, build et déploiement

# Couleur Tempo : RTE publie la couleur du lendemain à 10 h 30 (heure de Paris). Le site se
# reconstruit juste après (08:45 et 09:45 UTC couvrent l'heure d'été et l'heure d'hiver, 10:30 UTC
# rattrape un retard), puis peu après minuit à Paris pour que la page « aujourd'hui » du HTML change
# de date. À chaque passage : relevé RTE (scripts/data/fetch-tempo.mjs), tests du moteur, build,
# publication sur GitHub Pages, et le fichier des couleurs est recommité s'il a changé.
# Aucune clé d'API : les données ouvertes du calendrier Tempo de RTE sont publiques.
on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '45 8 * * *'
    - cron: '45 9 * * *'
    - cron: '30 10 * * *'
    - cron: '5 22 * * *'
    - cron: '5 23 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Relevé de la couleur Tempo (RTE)
        run: node scripts/data/fetch-tempo.mjs
      - name: Tests du moteur
        run: npx vitest run
      - name: Build (avec contrôle des snippets)
        run: npm run build
      - name: Recommit du fichier des couleurs s'il a changé
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "releve-tempo"
          git config user.email "releve-tempo@users.noreply.github.com"
          git add src/data/tempo.json
          if ! git diff --cached --quiet; then
            git commit -m "Couleurs Tempo : relevé RTE du $(date -u +%F)" && git push || echo "push refusé, relevé gardé pour le prochain passage"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (script IndexNow)
        uses: actions/checkout@v4
      - name: Ping IndexNow
        continue-on-error: true
        run: bash scripts/indexnow.sh https://tempodemain.fr
